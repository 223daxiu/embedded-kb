site_name: 嵌入式开发知识库
site_description: 涵盖 C/C++、MCU、Linux 驱动开发的系统性知识库
site_author: Your Name
site_url: https://223daxiu.github.io/embedded-kb/

repo_name: 223daxiu/embedded-kb
repo_url: https://github.com/223daxiu/embedded-kb
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    # 亮色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    # 暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs          # 顶部标签导航
    - navigation.sections      # 左侧折叠分组
    - navigation.top           # 返回顶部按钮
    - navigation.indexes       # 章节首页
    - search.highlight         # 搜索高亮
    - search.suggest           # 搜索建议
    - content.code.copy        # 代码复制按钮
    - content.code.annotate    # 代码注解
    - content.action.edit      # 在线编辑按钮
    - content.tabs.link        # 内容标签页
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:   # 显示最后修改时间
      type: date

markdown_extensions:
  - admonition              # 警告框（!!! note/warning/tip）
  - pymdownx.details        # 可折叠块
  - pymdownx.superfences:   # 代码块增强（支持 Mermaid）
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:     # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite   # 行内代码高亮
  - pymdownx.tabbed:        # 内容标签页
      alternate_style: true
  - pymdownx.emoji:         # emoji 支持
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list               # 图片对齐等属性
  - md_in_html              # HTML 中嵌入 Markdown
  - tables                  # 表格
  - toc:                    # 目录
      permalink: true

